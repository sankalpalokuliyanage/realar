<!DOCTYPE html>
<html>
<head>
    <title>AR 3D Crown</title>
    <style>
        body { margin: 0; overflow: hidden; }
        /* Make video visible as full-screen background and overlay canvas on top */
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #output { z-index: 0; }
        #board { z-index: 1; }
        #overlay { pointer-events: none; z-index: 2; }
        /* toolbar */
        #toolbar { position: absolute; left: 12px; top: 12px; z-index: 3; display:flex; gap:8px; }
        .tool-button { background: rgba(0,0,0,0.5); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .tool-button.active { background: rgba(255,255,255,0.95); color: #222; }
        .tool-button.hover { box-shadow: 0 0 12px rgba(255,200,120,0.6); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    <canvas id="board"></canvas>
    <canvas id="overlay"></canvas>
    <div id="toolbar">
        <button id="tool-pencil" class="tool-button active">Pencil</button>
        <button id="tool-eraser" class="tool-button">Eraser</button>
        <button id="tool-clear" class="tool-button">Clear</button>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
